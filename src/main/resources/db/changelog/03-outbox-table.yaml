databaseChangeLog:
  - changeSet:
      id: 03
      author: goktugbati
      changes:
        - createTable:
            tableName: outbox_event
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: event_type
                  type: varchar(255)
              - column:
                  name: account_number
                  type: varchar(255)
              - column:
                  name: amount
                  type: double
              - column:
                  name: approval_code
                  type: varchar(255)
              - column:
                  name: timestamp
                  type: timestamp
              - column:
                  name: published
                  type: boolean
